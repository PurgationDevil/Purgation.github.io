<!-- 回到顶部按钮 -->
<style>
.go-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 48px;
  height: 48px;
  background: #0085a1;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 25px;
  padding-left: 19px;
  font-weight: bold;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  text-decoration: none;
  border: none;
}

.go-top:hover {
  background: #006680;
  transform: scale(1.08);
}

.go-top.show {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 768px) {
  .go-top {
    bottom: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    font-size: 20px;
  }
}

/* 手机端浮动目录按钮 - 默认隐藏 */
.toc-mobile-btn {
  position: fixed;
  right: 15px;
  bottom: 100px;
  width: 45px;
  height: 45px;
  background: #0085a1;
  color: #fff;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  cursor: pointer;
  z-index: 1000;
  display: none !important;
}

.toc-mobile-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 2000;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
}

.toc-mobile-panel.active {
  transform: translateX(0);
}

.toc-mobile-content {
  position: absolute;
  left: 0;
  top: 0;
  width: 85%;
  max-width: 320px;
  height: 100%;
  background: #fff;
  padding: 20px;
  overflow-y: auto;
}

.toc-mobile-content h4 {
  margin: 0 0 15px 0;
  font-size: 16px;
  font-weight: 600;
  color: #333;
  padding-bottom: 10px;
  border-bottom: 2px solid #0085a1;
}

.toc-mobile-content ul {
  list-style: none;
  padding-left: 0;
  margin: 0;
}

.toc-mobile-content li {
  margin: 10px 0;
}

.toc-mobile-content a {
  color: #555;
  text-decoration: none;
  font-size: 14px;
  display: block;
  padding: 8px;
  border-radius: 4px;
  transition: all 0.2s;
}

.toc-mobile-content a:hover,
.toc-mobile-content a.active {
  background: #f0f0f0;
  color: #0085a1;
}

.toc-mobile-close {
  position: absolute;
  right: 15px;
  top: 15px;
  font-size: 24px;
  color: #999;
  cursor: pointer;
}

/* 手机端显示目录按钮 */
@media (max-width: 992px) {
  .toc-mobile-btn.show {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
}

/* 深色模式手机端目录 */
@media (prefers-color-scheme: dark) {
  .toc-mobile-content {
    background: #0a141e;
  }
  
  .toc-mobile-content h4 {
    color: #fff;
    border-bottom-color: #00d4ff;
  }

  }

  }

  }
}
</style>

<script>
(function() {
  var btn = document.getElementById('goTopBtn');
  if (!btn) return;
  
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  });
  
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

<!-- 目录功能 JavaScript -->
<script>
(function() {
  function initToc() {
    var article = document.querySelector('.post-container');
    if (!article) return;
    
    var headers = article.querySelectorAll('h2, h3');
    if (headers.length === 0) return;
    
    // 显示目录按钮（只有文章页面才显示）
    var mobileBtn = document.getElementById('tocMobileBtn');
    if (mobileBtn) {
      mobileBtn.classList.add('show');
    }
    
    // 创建手机端目录列表
    var mobileTocList = document.getElementById('tocMobileList');
    if (!mobileTocList) return;
    mobileTocList.innerHTML = '';
    
    headers.forEach(function(header, index) {
      var id = 'toc-' + index;
      header.id = id;
      
      // 手机端目录项
      var mobileLi = document.createElement('li');
      var mobileA = document.createElement('a');
      mobileA.href = '#' + id;
      mobileA.textContent = header.textContent;
      mobileA.addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('tocMobilePanel').classList.remove('active');
      });
      mobileLi.appendChild(mobileA);
      mobileTocList.appendChild(mobileLi);
    });
    
    // 高亮当前章节
    var tocLinks = document.querySelectorAll('.toc-mobile-content a');
    window.addEventListener('scroll', function() {
      var scrollPos = window.scrollY + 100;
      var currentId = null;
      
      headers.forEach(function(header) {
        var offsetTop = header.offsetTop;
        if (offsetTop <= scrollPos) {
          currentId = header.id;
        }
      });
      
      tocLinks.forEach(function(link) {
        link.classList.remove('active');
        var href = link.getAttribute('href').substring(1);
        if (href === currentId) {
          link.classList.add('active');
        }
      });
    });
  }
  
  // 手机端目录按钮事件
  var mobileBtn = document.getElementById('tocMobileBtn');
  var mobilePanel = document.getElementById('tocMobilePanel');
  var mobileClose = document.getElementById('tocMobileClose');
  
  if (mobileBtn && mobilePanel) {
    mobileBtn.addEventListener('click', function() {
      mobilePanel.classList.add('active');
    });
  }
  
  if (mobileClose && mobilePanel) {
    mobileClose.addEventListener('click', function() {
      mobilePanel.classList.remove('active');
    });
  }
  
  if (mobilePanel) {
    mobilePanel.addEventListener('click', function(e) {
      if (e.target === mobilePanel) {
        mobilePanel.classList.remove('active');
      }
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initToc);
  } else {
    initToc();
  }
})();
</script>

<!-- 鼠标点击特效 -->
<style>
.click-particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  animation: particleExplode 0.6s ease-out forwards;
}

.click-ripple {
  position: fixed;
  border: 3px solid #ff69b4;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: rippleExpand 0.8s ease-out forwards;
}

@keyframes particleExplode {
  0% {
    opacity: 1;
    transform: translate(0, 0);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty));
  }
}

@keyframes rippleExpand {
  0% {
    opacity: 1;
    transform: scale(0);
  }
  100% {
    opacity: 0;
    transform: scale(3);
  }
}
</style>

<script>
(function() {
  var colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff6600', '#0066ff', '#ff3366'];
  
  document.addEventListener('click', function(e) {
    var centerX = e.clientX;
    var centerY = e.clientY;
    
    var count = 6;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
      var distance = 80 + Math.random() * 60;
      var size = 10 + Math.random() * 16;
      var particle = document.createElement('div');
      particle.className = 'click-particle';
      
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = centerX - size/2 + 'px';
      particle.style.top = centerY - size/2 + 'px';
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.boxShadow = '0 0 ' + (size/2 + 8) + 'px ' + particle.style.backgroundColor + ', 0 0 ' + (size + 15) + 'px ' + particle.style.backgroundColor;
      
      var tx = Math.cos(angle) * distance;
      var ty = Math.sin(angle) * distance;
      particle.style.setProperty('--tx', tx + 'px');
      particle.style.setProperty('--ty', ty + 'px');
      
      document.body.appendChild(particle);
      
      setTimeout(function(p) {
        p.remove();
      }, 600, particle);
    }
    
    var ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.width = '40px';
    ripple.style.height = '40px';
    ripple.style.left = centerX - 20 + 'px';
    ripple.style.top = centerY - 20 + 'px';
    document.body.appendChild(ripple);
    
    setTimeout(function(r) {
      r.remove();
    }, 800, ripple);
  });
})();
</script>
