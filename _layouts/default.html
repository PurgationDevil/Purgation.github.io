<!-- 回到顶部按钮 -->
<style>
.go-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 48px;
  height: 48px;
  background: #0085a1;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 25px;
  padding-left: 19px;
  font-weight: bold;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  text-decoration: none;
  border: none;
}

.go-top:hover {
  background: #006680;
  transform: scale(1.08);
}

.go-top.show {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 768px) {
  .go-top {
    bottom: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    font-size: 20px;
  }
}
</style>

<div class="go-top" id="goTopBtn">↑</div>

<script>
(function() {
  var btn = document.getElementById('goTopBtn');
  if (!btn) return;
  
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  });
  
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

<!-- 鼠标点击特效 -->
<style>
.click-particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  animation: particleExplode 0.6s ease-out forwards;
}

.click-ripple {
  position: fixed;
  border: 3px solid #ff69b4;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: rippleExpand 0.8s ease-out forwards;
}

@keyframes particleExplode {
  0% {
    opacity: 1;
    transform: translate(0, 0);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty));
  }
}

@keyframes rippleExpand {
  0% {
    opacity: 1;
    transform: scale(0);
  }
  100% {
    opacity: 0;
    transform: scale(3);
  }
}
</style>

<script>
(function() {
  var colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff6600', '#0066ff', '#ff3366'];
  
  document.addEventListener('click', function(e) {
    var centerX = e.clientX;
    var centerY = e.clientY;
    
    var count = 6;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
      var distance = 80 + Math.random() * 60;
      var size = 10 + Math.random() * 16;
      var particle = document.createElement('div');
      particle.className = 'click-particle';
      
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = centerX - size/2 + 'px';
      particle.style.top = centerY - size/2 + 'px';
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.boxShadow = '0 0 ' + (size/2 + 8) + 'px ' + particle.style.backgroundColor + ', 0 0 ' + (size + 15) + 'px ' + particle.style.backgroundColor;
      
      var tx = Math.cos(angle) * distance;
      var ty = Math.sin(angle) * distance;
      particle.style.setProperty('--tx', tx + 'px');
      particle.style.setProperty('--ty', ty + 'px');
      
      document.body.appendChild(particle);
      
      setTimeout(function(p) {
        p.remove();
      }, 600, particle);
    }
    
    var ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.width = '40px';
    ripple.style.height = '40px';
    ripple.style.left = centerX - 20 + 'px';
    ripple.style.top = centerY - 20 + 'px';
    document.body.appendChild(ripple);
    
    setTimeout(function(r) {
      r.remove();
    }, 800, ripple);
  });
})();
</script>

        document.body.classList.add('animecursor-disabled');
    }
});

window.addEventListener('load', function() {
    setTimeout(function() {

        if (loader) {

            setTimeout(function() {

            }, 600);
        }
    }, 500);
});
</script>
