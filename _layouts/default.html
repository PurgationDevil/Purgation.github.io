<!-- 回到顶部按钮 -->
<style>
.go-top {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 48px;
  height: 48px;
  background: #0085a1;
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 25px;
  padding-left: 17px;
  font-weight: bold;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  text-decoration: none;
  border: none;
}

.go-top:hover {
  background: #006680;
  transform: scale(1.08);
}

.go-top.show {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 768px) {
  .go-top {
    bottom: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    font-size: 20px;
  }
}

/* 点击波纹特效 */
.ripple {
  position: fixed;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,102,153,0.6), rgba(255,51,102,0.3));
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 9999;
  animation: rippleAnim 0.6s ease-out forwards;
}

@keyframes rippleAnim {
  0% {
    width: 0;
    height: 0;
    opacity: 0.8;
  }
  100% {
    width: 120px;
    height: 120px;
    opacity: 0;
  }
}

/* 搜索页面样式 */
.search-page {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  z-index: 2000;
  transform: translateY(100%);
  transition: transform 0.4s ease;
  overflow-y: auto;
}

.search-page.search-active {
  transform: translateY(0);
}

.search-icon-close-container {
  position: absolute;
  top: 20px;
  right: 20px;
  cursor: pointer;
  font-size: 24px;
  z-index: 2001;
}

.search-main {
  padding-top: 80px;
}

#search-input {
  width: 100%;
  padding: 15px;
  font-size: 24px;
  border: none;
  border-bottom: 2px solid #0085a1;
  outline: none;
}

#search-results {
  margin-top: 30px;
}

/* 导航栏样式 */
.navbar-custom .nav li a,
.navbar-custom .navbar-brand {
    color: #66ccff !important;
}

.navbar-custom .nav li a:hover,
.navbar-custom .navbar-brand:hover {
    color: #3399ff !important;
}

.navbar-custom {
    background-color: rgba(255, 255, 255, 0.85) !important;
}

.intro-header .site-heading h1,
.intro-header .page-heading h1 {
    color: #ffffff !important;
    font-size: 60px !important;
}

.intro-header .site-heading .subheading {
    color: #ffffff !important;
}

.intro-header {
    position: relative;
}

.intro-header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
    pointer-events: none;
}
</style>

<div class="go-top" id="goTopBtn">↑</div>

<script>
(function() {
  var btn = document.getElementById('goTopBtn');
  if (!btn) return;
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

<!-- 特效延迟加载 -->
<script>
// 等页面加载完2秒后再加载特效，避免阻塞首屏
window.addEventListener('load', function() {
    setTimeout(function() {
        // 1. 点击波纹特效（使用requestAnimationFrame优化）
        (function() {
            var lastClickTime = 0;
            document.addEventListener('click', function(e) {
                var now = Date.now();
                if (now - lastClickTime < 50) return; // 节流，防止频繁点击
                lastClickTime = now;
                
                var ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = e.clientX + 'px';
                ripple.style.top = e.clientY + 'px';
                document.body.appendChild(ripple);
                setTimeout(function() { ripple.remove(); }, 600);
            });
        })();

        // 2. 粒子背景（延迟加载+减少粒子）
        var particlesDiv = document.createElement('div');
        particlesDiv.id = 'particles-js';
        particlesDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;';
        document.body.appendChild(particlesDiv);
        
        var particlesScript = document.createElement('script');
        particlesScript.src = 'https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js';
        particlesScript.onload = function() {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 40 }, // 减少粒子数量
                    "color": { "value": "#00ffff" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.6, "random": true },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": false },
                    "move": { "enable": true, "speed": 2, "direction": "none", "random": true }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": { "enable": false },
                        "onclick": { "enable": false }
                    }
                }
            });
        };
        document.body.appendChild(particlesScript);

        // 3. 鼠标点击樱花特效（节流优化）
        (function() {
            var lastFlowerTime = 0;
            function createFlower(x, y) {
                var flower = document.createElement('div');
                flower.innerHTML = '🌸';
                flower.style.position = 'fixed';
                flower.style.left = x + 'px';
                flower.style.top = y + 'px';
                flower.style.fontSize = '20px';
                flower.style.pointerEvents = 'none';
                flower.style.zIndex = '9999';
                flower.style.opacity = '1';
                flower.style.transition = 'all 1s ease-out';
                document.body.appendChild(flower);
                setTimeout(function() {
                    flower.style.transform = 'translateY(-80px)';
                    flower.style.opacity = '0';
                    flower.style.fontSize = '12px';
                }, 10);
                setTimeout(function() { flower.remove(); }, 1000);
            }
            document.addEventListener('click', function(e) {
                var now = Date.now();
                if (now - lastFlowerTime < 80) return; // 节流，防止频繁创建
                lastFlowerTime = now;
                createFlower(e.clientX, e.clientY);
            });
        })();
    }, 2000); // 延迟2秒加载
});
</script>
